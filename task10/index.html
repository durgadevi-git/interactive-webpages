<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Dashboard</title>

    <link rel="stylesheet" href="external.css">
</head>

<body>

    <div class="dashboard">


        <!-- HEADER -->
        <div class="header">

            <h1>Dashboard</h1>

            <h3>Admin ▼</h3>

        </div>

        <!-- SIDEBAR -->
        <div class="sidebar">

            <h2>Menu</h2>

            <ul>
                <li>Overview</li>
                <li>Students</li>
                <li>Courses</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>

        </div>

        <!-- MAIN -->
        <div class="main">

            <!-- CARDS -->
            <div class="cards">

                <div class="card">
                    <h3>Students</h3>
                    <p>248</p>
                </div>

                <div class="card">
                    <h3>Courses</h3>
                    <p>12</p>
                </div>

                <div class="card">
                    <h3>Pass Rate</h3>
                    <p>94%</p>
                </div>

            </div>

            <!-- CHART -->
            <div class="chart-box">

                <h2>Performance Chart</h2>

                <div class="chart">

                    <div class="bar bar1"></div>
                    <div class="bar bar2"></div>
                    <div class="bar bar3"></div>
                    <div class="bar bar4"></div>
                    <div class="bar bar5"></div>
                    <div class="bar bar6"></div>
                    <div class="bar bar7"></div>

                </div>

                <div class="months">
                    <span>Jan</span>
                    <span>Feb</span>
                    <span>Mar</span>
                    <span>Apr</span>
                    <span>May</span>
                    <span>Jun</span>
                    <span>Jul</span>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
