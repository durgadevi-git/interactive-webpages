<!DOCTYPE html>
<html>
<head>
    <title>Paragraph Styling</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: #F4F6F7;
            padding: 20px;
        }

        p{
            color: #2C3E50;
            font-size: 18px;
            line-height: 1.6;
        }

        strong{
            color: #1B4F72;
        }

        em{
            color: #7D3C98;
        }

        mark{
            background: yellow;
            padding: 2px;
        }

        hr{
            border: 1px solid #3498DB;
        }
    </style>
</head>

<body>

    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit.
        Nostrum, perspiciatis. Libero qui laboriosam minima nisi
        ex itaque provident eligendi temporibus.
        Facere impedit est veniam quod consectetur,
        libero nesciunt a in.
    </p>

    <hr>

    <p>
        iam reading books and
        <strong>watching phone</strong>
    </p>

    <p>
        <em>my goal is acheving my <mark>dream</mark></em>
    </p>

</body>
</html>
