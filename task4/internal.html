<!DOCTYPE html>
<html>
<head>
    <title>My Skills</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: #F4F6F7;
            padding: 20px;
        }

        h2{
            color: #1B4F72;
        }

        ul{
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        ol{
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        li{
            color: #2E4053;
            font-size: 18px;
            margin: 10px 0;
        }

        ul li{
            color: #117A65;
        }

        ol li{
            color: #8E44AD;
        }
    </style>
</head>

<body>

    <h2>My Skills</h2>

    <ul>
        <li>java</li>
        <li>python</li>
    </ul>

    <h2>how i spend my day</h2>

    <ol>
        <li>reading books</li>
        <li>listening music</li>
    </ol>

</body>
</html>
