<!DOCTYPE html>
<html>
<head>
    <title>Academic Report</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: #F4F6F7;
            padding: 20px;
        }

        .report{
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 70%;
            margin: auto;
        }

        h2{
            color: #1B4F72;
            text-align: center;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th{
            background: #2E86AB;
            color: white;
            padding: 12px;
        }

        td{
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        tfoot td{
            background: #D6EAF8;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="report">

        <h2>My Academic Report</h2>

        <table>

            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Assignment</th>
                    <th>Exam</th>
                    <th>Total</th>
                    <th>Grade</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Mathematics</td>
                    <td>18</td>
                    <td>75</td>
                    <td>93</td>
                    <td>A+</td>
                </tr>

                <tr>
                    <td>Science</td>
                    <td>17</td>
                    <td>70</td>
                    <td>87</td>
                    <td>A</td>
                </tr>

                <tr>
                    <td>English</td>
                    <td>16</td>
                    <td>68</td>
                    <td>84</td>
                    <td>B+</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="5">Class Average: 88%</td>
                </tr>
            </tfoot>

        </table>

    </div>

</body>
</html>
